apiVersion: v1
kind: Service
metadata:
  name: {{ template "laya-decision-studio.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laya-decision-studio.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.studio.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "laya-decision-studio.selectorLabels" . | nindent 4 }}
