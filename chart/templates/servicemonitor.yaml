{{- if .Values.studio.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ template "laya-decision-studio.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laya-decision-studio.labels" . | nindent 4 }}
    {{- with .Values.studio.metrics.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "laya-decision-studio.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.studio.metrics.serviceMonitor.interval }}
      {{- with .Values.studio.metrics.serviceMonitor.scrapeTimeout }}
      scrapeTimeout: {{ . }}
      {{- end }}
{{- end }}
